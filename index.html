<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Global Urban Bird Survey</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      color: #222;
    }

    /* City selection page */
    .city-menu {
      max-width: 1100px;
      margin: 0 auto;
      padding: 50px 20px;
      text-align: center;
    }

    .city-menu h1 {
      margin-bottom: 10px;
    }

    .city-menu p {
      color: #555;
      margin-bottom: 35px;
    }

    #cityLinks {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
    }

    .city-card {
      display: block;
      padding: 30px 20px;
      background: white;
      border: 1px solid #ddd;
      border-radius: 10px;
      text-decoration: none;
      color: inherit;
      transition: box-shadow 0.2s ease, transform 0.2s ease;
    }

    .city-card:hover {
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.15);
      transform: translateY(-3px);
    }

    .city-card h3 {
      margin: 0 0 8px;
      font-size: 22px;
    }

    .city-card p {
      margin: 0;
      color: #666;
      font-size: 14px;
    }

    /* Individual city map page */
    #singleMapContainer {
      width: 100%;
      min-height: 100vh;
    }

    .map-header {
      padding: 15px 20px;
      background: white;
      border-bottom: 1px solid #ddd;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 5px;
      font-weight: bold;
      text-decoration: none;
      color: #0066cc;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    #cityTitle {
      margin: 0;
      font-size: 26px;
    }

    #map {
      width: 100%;
      height: calc(100vh - 105px);
    }

    @media (max-width: 600px) {
      #map {
        height: calc(100vh - 130px);
      }
    }
  </style>
</head>

<body>
  <!-- City selection page -->
  <div id="cityMenu" class="city-menu">
    <h1>Global Urban Bird Survey</h1>
    <p>Select a city to explore its survey locations and reported species.</p>

    <div id="cityLinks"></div>
  </div>

  <!-- Individual city map page -->
  <div id="singleMapContainer" style="display: none;">
    <div class="map-header">
      <a href="index.html" class="back-link">&larr; Back to all cities</a>
      <h2 id="cityTitle"></h2>
    </div>

    <div id="map"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>

  <script>
    // Read ?city=Dakar from the URL
    const urlParams = new URLSearchParams(window.location.search);
    const selectedCity = urlParams.get("city");

    const cityMenu = document.getElementById("cityMenu");
    const singleMapContainer = document.getElementById("singleMapContainer");

    // Show either the city menu or one large city map
    if (selectedCity) {
      cityMenu.style.display = "none";
      singleMapContainer.style.display = "block";
      document.getElementById("cityTitle").textContent = selectedCity;
    } else {
      cityMenu.style.display = "block";
      singleMapContainer.style.display = "none";
    }

    // Load the CSV and build the maps
    Papa.parse("data.csv", {
      download: true,
      header: true,
      dynamicTyping: false,
complete: async function (results) {
  const data = results.data;

  function normalizeName(value) {
    return String(value || "")
      .toLowerCase()
      .replace(/[^a-z]/g, "");
  }

  let reference;

  try {
    reference = await new Promise(function(resolve, reject) {
      Papa.parse("species_reference.csv", {
        download: true,
        header: true,
        skipEmptyLines: "greedy",
        dynamicTyping: false,

        transformHeader: function(header) {
          return header.replace(/^\uFEFF/, "").trim();
        },

        complete: function(parsed) {
          if (parsed.errors.length > 0) {
            reject(new Error("Could not read species_reference.csv."));
          } else {
            resolve(parsed.data);
          }
        },

        error: reject
      });
    });
  } catch (error) {
    console.error(error);

    document.getElementById("cityTitle").textContent =
      "Unable to load species reference";

    document.getElementById("cityLinks").textContent =
      "Unable to load species_reference.csv. Please try again later.";

    return;
  }

  const speciesLookup = new Map();

  reference.forEach(function(record) {
    const scientificName = String(record.scientific_name || "").trim();
    const commonName = String(record.common_name || "").trim();
    const code = String(record.species_code || "").trim();

    if (
      !scientificName ||
      !commonName ||
      !code ||
      /^(na|n\/a)$/i.test(code)
    ) {
      return;
    }

    [scientificName, commonName].forEach(function(name) {
      const key = normalizeName(name);
      if (!key) return;

      if (!speciesLookup.has(key)) {
        speciesLookup.set(key, new Set());
      }

      speciesLookup.get(key).add(code);
    });
  });

  function summarizeSurvey(speciesText) {
    const uniqueEntries = new Set();
    const unresolvedEntries = new Set();

    String(speciesText || "")
      .split(",")
      .map(function(name) {
        return name.trim();
      })
      .filter(function(name) {
        return name !== "" && !/^(na|n\/a|none)$/i.test(name);
      })
      .forEach(function(name) {
        const key = normalizeName(name);
        const candidates = speciesLookup.get(key);

        if (candidates && candidates.size === 1) {
          const code = candidates.values().next().value;
          uniqueEntries.add("code:" + code);
        } else {
          uniqueEntries.add("unmatched:" + key);
          unresolvedEntries.add(key);
        }
      });

    return {
      count: uniqueEntries.size,
      unresolved: unresolvedEntries.size
    };
  }

        // Get all unique city names from the CSV
        const cityNames = [...new Set(
          data
            .map(function (row) {
              return row.SurveyCity;
            })
            .filter(function (city) {
              return city && city.trim() !== "";
            })
        )];

        // Build the city-selection cards
        const cityLinks = document.getElementById("cityLinks");

        cityNames.forEach(function (city) {
          const link = document.createElement("a");
          link.href = "?city=" + encodeURIComponent(city);
          link.className = "city-card";
          link.innerHTML =
            "<h3>" + city + "</h3>" +
            "<p>View survey locations and species</p>";

          cityLinks.appendChild(link);
        });

        // If no city is selected, do not create the large map
        if (!selectedCity) {
          return;
        }

        // Filter data to the selected city
        const cityData = data.filter(function (row) {
          return row.SurveyCity === selectedCity;
        });

        // Create the large map
        const map = L.map("map");

        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
          maxZoom: 18,
          attribution: "&copy; OpenStreetMap contributors"
        }).addTo(map);

        const markers = [];

        cityData.forEach(function (row) {
          const city = row.SurveyCity;
          const pointId = row.PointID;
          const lat = parseFloat(row.Latitude);
          const lng = parseFloat(row.Longitude);

          if (!pointId || isNaN(lat) || isNaN(lng)) {
            return;
          }

// Build the popup using the same counting rules as survey.html
let popupHtml = "";

const pointLabel = document.createElement("strong");
pointLabel.textContent = pointId;

const cityLabel = document.createElement("span");
cityLabel.textContent = city;

popupHtml += pointLabel.outerHTML + "<br>";
popupHtml += cityLabel.outerHTML + "<br><br>";

for (let i = 1; i <= 4; i++) {
  const speciesText =
    row["Survey" + i] ||
    row["Survey " + i] ||
    "";

  const surveySummary = summarizeSurvey(speciesText);

  if (surveySummary.count > 0) {
    const countLabel = surveySummary.unresolved > 0
      ? surveySummary.count + " entries (" +
        surveySummary.unresolved + " needing name review)"
      : surveySummary.count + " species";

    popupHtml +=
      "<b>Survey " + i + "</b>: " + countLabel + " " +
      '<a href="survey.html?point=' +
      encodeURIComponent(pointId) +
      "&survey=" + i +
      '" target="_blank" rel="noopener noreferrer">[View]</a><br>';
  }
}

          const marker = L.marker([lat, lng]).bindPopup(popupHtml);
          marker.addTo(map);
          markers.push(marker);
        });

        // Zoom tightly to the selected city's points
        if (markers.length > 0) {
          const group = L.featureGroup(markers);
          map.fitBounds(group.getBounds(), {
            padding: [40, 40],
            maxZoom: 16
          });
        } else {
          map.setView([0, 0], 2);
        }

        // Make sure Leaflet redraws correctly after resizing
        window.addEventListener("resize", function () {
          map.invalidateSize();
        });
      }
    });
  </script>
</body>
</html>
