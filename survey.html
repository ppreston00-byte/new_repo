<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Species list | Global Urban Bird Survey</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f7f7f7;
      color: #222;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 20px;
      color: #0066cc;
      font-weight: bold;
      text-decoration: none;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    h1 {
      margin: 0 0 5px;
      font-size: 32px;
    }

    .subtitle {
      margin: 0 0 25px;
      color: #666;
      font-size: 18px;
    }

    .summary {
      display: inline-block;
      background: #eef6ff;
      color: #00529b;
      padding: 8px 15px;
      border-radius: 20px;
      font-weight: bold;
      margin-bottom: 30px;
    }

    .species-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 12px;
    }

    .species-item {
      background: white;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 15px;
    }

    .species-item a {
      color: #0066cc;
      font-weight: bold;
      text-decoration: none;
      word-break: break-word;
    }

    .species-item a:hover {
      text-decoration: underline;
    }

    .no-species {
      background: white;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 25px;
      color: #666;
    }

    .error {
      background: #fff3f3;
      border: 1px solid #ffcccc;
      color: #a30000;
      padding: 20px;
      border-radius: 8px;
    }
  </style>
</head>

<body>
  <div class="container">
    <a href="index.html" class="back-link">&larr; Back to map</a>

    <h1 id="pageTitle">Species list</h1>
    <p class="subtitle" id="pageSubtitle"></p>

    <div id="summary"></div>
    <div id="speciesContainer"></div>
  </div>

  <script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>

  <script>
    // Read ?point=Dakar_18&survey=1 from the URL
    const urlParams = new URLSearchParams(window.location.search);
    const pointId = urlParams.get("point");
    const surveyNumber = urlParams.get("survey");

    const pageTitle = document.getElementById("pageTitle");
    const pageSubtitle = document.getElementById("pageSubtitle");
    const summary = document.getElementById("summary");
    const speciesContainer = document.getElementById("speciesContainer");

    if (!pointId || !surveyNumber) {
      pageTitle.textContent = "Survey not found";
      pageSubtitle.textContent = "Please return to the map and select a survey point.";
      speciesContainer.innerHTML =
        '<div class="error">Missing survey information.</div>';
    } else {
      pageTitle.textContent = pointId + " — Survey " + surveyNumber;
      pageSubtitle.textContent =
        "Species reported during Survey " + surveyNumber;

      Papa.parse("data.csv", {
        download: true,
        header: true,
        dynamicTyping: false,
        complete: function (results) {
          const data = results.data;

          const row = data.find(function (item) {
            return item.PointID === pointId;
          });

          if (!row) {
            speciesContainer.innerHTML =
              '<div class="error">Could not find survey point: ' +
              pointId +
              "</div>";
            return;
          }

          // Get the species list for the selected survey
          const surveyColumn = "Survey" + surveyNumber;
          const speciesText = row[surveyColumn] || "";

          const species = speciesText
            .split(",")
            .map(function (name) {
              return name.trim();
            })
            .filter(function (name) {
              return name !== "";
            });

          summary.innerHTML =
            "<span class='summary'>" +
            species.length +
            " species reported</span>";

          if (species.length === 0) {
            speciesContainer.innerHTML =
              '<div class="no-species">No species were recorded for this survey.</div>';
            return;
          }

          // Create a clean species list
          const list = document.createElement("ul");
          list.className = "species-list";

          species.forEach(function (scientificName) {
            const item = document.createElement("li");
            item.className = "species-item";

            const link = document.createElement("a");
            link.href =
              "https://birdsoftheworld.org/bow/search?query=" +
              encodeURIComponent(scientificName);
            link.target = "_blank";
            link.rel = "noopener";
            link.textContent = scientificName;

            item.appendChild(link);
            list.appendChild(item);
          });

          speciesContainer.appendChild(list);
        }
      });
    }
  </script>
</body>
</html>
